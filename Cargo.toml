[package]
name = "cantrip-cli"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "Speak plainly. Get the incantation. A beautiful, keyless shell companion."
authors = ["Flock <hello@flock.holdings>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/flockcap/cantrip"
homepage = "https://github.com/flockcap/cantrip"
readme = "README.md"
keywords = ["cli", "shell", "terminal", "command", "keyless"]
categories = ["command-line-utilities"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-*", "/shells/**", "/tests/**"]

[[bin]]
name = "cantrip"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "6"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "signal"] }
toml = "0.9"
unicode-width = "0.2"
which = "8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cantrip-cli-{ target }{ archive-suffix }"
bin-dir = "cantrip-cli-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tar.xz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
